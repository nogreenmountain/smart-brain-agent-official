server_tokens off;

server {
    # ai-workspace-records-scroll-20261008: actual AI workspace entry.
    location = /workday {
        proxy_pass http://agentops-dashboard:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

# Splice into each ACTUAL public/edge server context after read-only inspection.
# Do not replace an active configuration with an older repository snapshot.
# Exact locations take precedence over static-file and legacy proxy fallbacks.
location = /downloads/smartbrain_codex_adapter.py {
    add_header Cache-Control "no-store" always;
    return 410;
}
location = /downloads/Start-SmartBrainCodexAdapter.ps1 {
    add_header Cache-Control "no-store" always;
    return 410;
}
location = /downloads/Start-SmartBrain-CodexProject.ps1 {
    add_header Cache-Control "no-store" always;
    return 410;
}
location = /downloads/Start-SmartBrain-Codex-Project.cmd {
    add_header Cache-Control "no-store" always;
    return 410;
}

    # Current company-memory installer; the workday frontend remains unchanged.
    location = /downloads/smartbrain-company-memory-codex.zip {
        proxy_pass http://agentops-dashboard:3000;
        proxy_set_header Host $http_host;
        add_header Cache-Control "no-store" always;
    }

    location = /downloads/SmartBrain-Company-Memory-Update.ps1 {
        proxy_pass http://agentops-dashboard:3000;
        proxy_set_header Host $http_host;
        add_header Cache-Control "no-store" always;
    }

  # Main workday: immutable Gateway body reads, registered member scope.
  location = /v4/ai-usage/options {
    proxy_pass http://workday-gateway-read:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
  location = /v4/ai-usage/records {
    proxy_pass http://workday-gateway-read:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
  location ^~ /v4/ai-usage/gateway-requests/ {
    proxy_pass http://workday-gateway-read:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  # Personal API registered employees 20260910-r1; authenticated member scope.
  location ^~ /v4/ai-gateway/ {
    proxy_pass http://personal-key-api-r1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
  location ^~ /v4/personal-api/v1/ {
    proxy_pass http://personal-key-api-r1:8000/v1/;
    proxy_set_header Host personal-key-api-r1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering off;
  }
  location = /v4/personal-api {
    proxy_pass http://personal-gray-web:8080;
  }
  location = /v4/personal-api/page.js {
    proxy_pass http://personal-gray-web:8080;
  }
  location = /v4/personal-api/style.css {
    proxy_pass http://personal-gray-web:8080;
  }

    listen 8080;
    # Existing frontend SSH forward uses port 3000 within Docker only.
    listen 3000;
    server_name _;

    client_max_body_size 512m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    # Docker assigns a new IP when wiki-mcp is recreated. Resolve the service
    # through Docker's embedded DNS at request time instead of pinning the
    # address resolved when this Nginx container started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $wiki_mcp_upstream wiki-mcp:8010;

    location ^~ /auth/v1/ {
        proxy_pass http://auth-gateway:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SmartBrain's cookie/session endpoints are served by the API, while the
    # longer /auth/v1 prefix above remains Supabase GoTrue.
    location ^~ /auth/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /rest/v1/ {
        proxy_pass http://auth-gateway:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /storage/v1/ {
        proxy_pass http://auth-gateway:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Retire Monitor intake before it can reach an older API during rollout.
    # History and personal Gateway key endpoints continue through /v4/ below.
    location ~ ^/v4/(ai-chat/(device-ingest|ingest)|ai-monitor/devices/register|ai-usage/(cc-switch-sync/device-ingest|temporary-monitor-probes(/device-confirm)?|shared-sessions/(start|device-activate|device-command|device-sync|device-finalize)))/?$ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 410 '{"error":"monitor_retired","next":"/monitor/setup"}';
    }

    # Personal project collaboration workspace 20260911-r1.
    location = /admin {
        proxy_pass http://agentops-dashboard:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /personal-projects {
        proxy_pass http://agentops-dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /v4/project-collaboration/ {
        proxy_pass http://collaboration-api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /v4/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health/ready {
        proxy_pass http://api:8000/health/ready;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /mcp {
        proxy_pass http://$wiki_mcp_upstream/mcp;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://$wiki_mcp_upstream/.well-known/oauth-protected-resource/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location = /v1/traces {
        proxy_pass http://otelcollector:4318/v1/traces;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /traces {
        proxy_pass http://agentops-dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Both Next.js applications publish assets below /_next. SmartBrain owns
    # the public root; a missing asset is retried against AgentOps Dashboard.
    location ^~ /_next/ {
        proxy_pass http://workday-records-unified:3000;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        error_page 404 = @release_previous_primary_assets;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Keep existing browser chunks available across the frontend switch.
    location @release_previous_primary_assets {
        proxy_pass http://agentops-dashboard:3000;
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 404 = @previous_workday_assets;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @previous_workday_assets {
        proxy_pass http://workday-records-unified:3000;
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 404 = @previous_smartbrain_assets;
        proxy_set_header Host $http_host;
    }

    location @previous_smartbrain_assets {
        proxy_pass http://smartbrain:3000;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 404 = @agentops_assets;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @agentops_assets {
        proxy_pass http://agentops-dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }


    # monitor-removal-web-20260910-r2: static removal entry; no API migration.
    set $monitor_removal_upstream smartbrain-monitor-removal:8080;
    location = /monitor/setup {
        proxy_pass http://$monitor_removal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location = /monitor/setup/ {
        proxy_pass http://$monitor_removal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location = /monitor/removal {
        proxy_pass http://$monitor_removal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location = /monitor-removal-assets/style.css {
        proxy_pass http://$monitor_removal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location = /monitor-removal-assets/page.js {
        proxy_pass http://$monitor_removal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location = /downloads/SmartBrainMonitorRemoval.exe {
        proxy_pass http://$monitor_removal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location = /downloads/SmartBrainMonitorRemoval.exe.sha256 {
        proxy_pass http://$monitor_removal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }


    # monitor-removal-web-20260910-r3: static removal entry; no API migration.
    set $monitor_removal_public_upstream smartbrain-monitor-removal-public:8080;
    location = /v4/monitor-removal {
        proxy_pass http://$monitor_removal_public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location = /v4/monitor-removal/assets/style.css {
        proxy_pass http://$monitor_removal_public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location = /v4/monitor-removal/assets/page.js {
        proxy_pass http://$monitor_removal_public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location = /v4/monitor-removal/downloads/SmartBrainMonitorRemoval.exe {
        proxy_pass http://$monitor_removal_public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location = /v4/monitor-removal/downloads/SmartBrainMonitorRemoval.exe.sha256 {
        proxy_pass http://$monitor_removal_public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://workday-records-unified:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
