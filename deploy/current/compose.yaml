{
  "name": "${COMPOSE_PROJECT_NAME:-smartbrain-current}",
  "services": {
    "api": {
      "restart": "unless-stopped",
      "stop_grace_period": "60s",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "${LOG_MAX_SIZE:-20m}",
          "max-file": "${LOG_MAX_FILES:-5}"
        }
      },
      "user": "10001:10001",
      "read_only": true,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "pids_limit": 256,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=128m,uid=${APP_UID:-10001},gid=${APP_GID:-10001},mode=1777"
      ],
      "image": "sha256:8eac15848ae9e29080d9deba458d588e572d8b0b1188f8f10dc60040ec41d402",
      "mem_limit": "${API_MEM_LIMIT:-3g}",
      "cpus": "${API_CPUS:-3.0}",
      "command": [
        "/app/.venv/bin/uvicorn",
        "agentops.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "2"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "30s"
      },
      "platform": "linux/amd64",
      "pull_policy": "never",
      "env_file": [
        {
          "path": "${PRIVATE_ROOT:?PRIVATE_ROOT required}/env/api.env",
          "format": "raw"
        }
      ],
      "environment": {
        "PROTOCOL": "https",
        "API_DOMAIN": "${PUBLIC_HOST:?PUBLIC_HOST required}",
        "APP_DOMAIN": "${PUBLIC_HOST:?PUBLIC_HOST required}",
        "SUPABASE_URL": "http://auth-gateway:8080",
        "SUPABASE_HOST": "postgres",
        "SUPABASE_PORT": "5432",
        "REDIS_URL": "redis://redis:6379/0",
        "CLICKHOUSE_HOST": "clickhouse",
        "RAG_EMBEDDING_SERVICE_URL": "http://rag-embedding-service:8080",
        "RAG_RERANKER_SERVICE_URL": "http://rag-reranker-service:8080"
      },
      "networks": [
        "app",
        "data",
        "egress"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "${STATE_ROOT:?STATE_ROOT required}/material-uploads",
          "target": "/var/lib/agentops/material-uploads",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ]
    },
